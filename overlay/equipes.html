<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay · Compositions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/overlay.css">
<style>
  /* Compositions sur terrain. Deux dispositions (choisies dans le Studio) :
     « face à face » : terrain entier, une équipe par moitié, bancs de chaque côté ;
     « une équipe »  : grand demi-terrain, fiche de l'équipe à gauche, banc à droite. */
  #stage { position: absolute; inset: 0; opacity: 0; transition: opacity .3s .5s; }
  #board { position: absolute; inset: 0; transform: translate(var(--equipes-dx, 0), var(--equipes-dy, 0)) scale(var(--equipes-s, 1)); transform-origin: center; }
  #stage.on { opacity: 1; transition: opacity .2s; }

  /* ---------- Titre ---------- */
  .head { position: absolute; top: 48px; left: 0; right: 0; display: flex; justify-content: center; }
  .headin { position: relative; display: flex; align-items: stretch; height: 58px; border-radius: var(--r); overflow: hidden; }
  .tag { display: flex; align-items: center; padding: 0 24px; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 700; font-stretch: 125%; letter-spacing: .1em; text-transform: uppercase; }
  .title { display: flex; align-items: center; padding: 0 28px; background: var(--paper); color: var(--ink); font-size: 30px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; white-space: nowrap; }
  .title.kin { --d: .5s; }

  /* ---------- Terrain ---------- */
  .pitchwrap { position: absolute; border-radius: 16px; --slab: var(--pitch); }
  .pitch-svg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 16px; }
  .pitch-svg .turf { fill: var(--pitch); }
  .pitch-svg .lines * { fill: none; stroke: rgba(255,255,255,.55); stroke-width: var(--lw); }
  .pitch-svg .lines .dot { fill: rgba(255,255,255,.55); stroke: none; }
  .pitch-svg .lines .dash { stroke-dasharray: .015 .015; }
  .pitch-svg .lines .net { stroke-width: calc(var(--lw) * 3); stroke: rgba(255,255,255,.8); }
  /* le terrain se dessine à l'entrée */
  .intro .pitch-svg .lines :not(.dash):not(.dot) { stroke-dasharray: 1; animation: draw 1.1s cubic-bezier(.6,0,.2,1) .35s both; }
  .intro .pitch-svg .lines .dash, .intro .pitch-svg .lines .dot { animation: fadeIn .6s 1s both; }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes fadeIn { from { opacity: 0; } }

  /* ---------- Pions des joueurs ---------- */
  .tok {
    position: absolute; z-index: 2; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px; width: calc(var(--tok) * 1.9);
  }
  .face {
    position: relative; width: var(--tok); height: var(--tok); border-radius: 50%; overflow: hidden;
    background: var(--c); box-shadow: 0 0 0 3px var(--c), 0 0 0 calc(3px + var(--tok) * .05) var(--paper);
  }
  .face img { width: 100%; height: 100%; object-fit: cover; }
  .face svg { position: absolute; left: 12%; bottom: -4%; width: 76%; fill: var(--c2); opacity: .4; }
  .face .big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: calc(var(--tok) * .42); font-weight: 900; font-variant-numeric: tabular-nums; color: var(--t); }
  .face.has .big { display: none; }
  .badge {
    position: absolute; right: calc(50% - var(--tok) * .62); top: calc(var(--tok) * .62);
    min-width: calc(var(--tok) * .36); height: calc(var(--tok) * .36); padding: 0 4px; border-radius: 99px;
    display: none; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink); font-size: calc(var(--tok) * .2); font-weight: 900; font-variant-numeric: tabular-nums;
    box-shadow: 0 0 0 2px var(--c);
  }
  .face.has + .badge { display: flex; }
  .cap {
    position: absolute; left: calc(50% - var(--tok) * .62); top: calc(var(--tok) * .62 - var(--tok) * .7);
    width: calc(var(--tok) * .32); height: calc(var(--tok) * .32); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: var(--on-accent); font-style: normal; font-size: calc(var(--tok) * .17); font-weight: 900;
  }
  .tname {
    max-width: 100%; padding: 3px 8px; border-radius: 6px;
    background: var(--paper); color: var(--ink);
    font-size: calc(var(--tok) * .2 + 4px); font-weight: 800; font-stretch: 75%; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tok.vacant .face { background: transparent; box-shadow: 0 0 0 2px rgba(255,255,255,.4); }
  .tok.vacant .big { color: rgba(255,255,255,.5); }
  .tok.vacant .tname { display: none; }
  /* arrivée ligne par ligne : gardien, défense, milieu, attaque */
  .intro .tok { animation: tokIn .6s cubic-bezier(.3,1.5,.5,1) calc(1.1s + var(--row) * .14s + var(--col) * .04s) both; }
  @keyframes tokIn { from { opacity: 0; transform: translate(-50%, -30%) scale(.4); } }

  /* ---------- En-têtes d'équipe ---------- */
  .teamhead {
    position: absolute; display: flex; align-items: center; gap: 16px; height: 76px; padding: 0 22px 0 12px;
    background: var(--c); color: var(--t); border-radius: var(--r);
  }
  .teamhead.away { flex-direction: row-reverse; padding: 0 12px 0 22px; }
  .crest { flex: none; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 12px; background: var(--paper); color: var(--ink); font-size: 18px; font-weight: 900; font-stretch: 125%; }
  .crest img { max-width: 46px; max-height: 46px; object-fit: contain; }
  .teamhead b { font-size: 36px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; white-space: nowrap; }
  .teamhead small { display: block; font-size: 14px; font-weight: 700; font-stretch: 125%; letter-spacing: .1em; opacity: .8; }
  .intro .teamhead { animation: slideIn .6s cubic-bezier(.2,.9,.2,1) .7s both; }
  .intro .teamhead.away { animation-name: slideInR; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-40px); } }
  @keyframes slideInR { from { opacity: 0; transform: translateX(40px); } }

  /* ---------- Bancs ---------- */
  .bench { position: absolute; display: flex; flex-direction: column; border-radius: var(--r); overflow: hidden; background: var(--paper); color: var(--ink); }
  .bench h3 { margin: 0; padding: 12px 16px; font-size: 13px; font-weight: 700; font-stretch: 125%; letter-spacing: .12em; text-transform: uppercase; color: var(--t); background: var(--c); }
  .bench ul { list-style: none; margin: 0; padding: 6px 14px; flex: 1; min-height: 0; overflow: hidden; }
  .bench li { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 2px solid var(--mist); font-size: var(--bfs, 21px); font-weight: 700; font-stretch: 87.5%; text-transform: uppercase; white-space: nowrap; }
  .bench li .n { flex: none; min-width: 1.7em; text-align: center; font-weight: 900; font-stretch: 100%; background: var(--c); color: var(--t); border-radius: 5px; }
  .bench li span { overflow: hidden; text-overflow: ellipsis; }
  .bench li em { margin-left: auto; font-style: normal; font-size: .6em; font-weight: 700; font-stretch: 125%; letter-spacing: .08em; color: var(--mute); }
  .bench .coach { padding: 12px 16px; background: var(--mist); font-size: 19px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; }
  .bench .coach b { display: block; font-size: 11px; font-weight: 700; font-stretch: 125%; letter-spacing: .12em; color: var(--mute); }
  .intro .bench { animation: fadeUp .6s cubic-bezier(.2,.9,.2,1) 2s both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } }

  /* ---------- Fiche d'équipe (disposition « une équipe ») ---------- */
  .teamcard { position: absolute; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
  .teamcard .crest { width: 150px; height: 150px; border-radius: 28px; font-size: 44px; }
  .teamcard .crest img { max-width: 124px; max-height: 124px; }
  .teamcard .tn { padding: 10px 22px; border-radius: var(--r); background: var(--c); color: var(--t); font-size: 64px; line-height: 1; font-weight: 800; font-stretch: 75%; text-transform: uppercase; }
  .teamcard .fo { padding: 8px 16px; border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 20px; font-weight: 700; font-stretch: 125%; letter-spacing: .08em; }
  .intro .teamcard > * { animation: slideIn .6s cubic-bezier(.2,.9,.2,1) both; }
  .intro .teamcard > :nth-child(1) { animation-delay: .6s; }
  .intro .teamcard > :nth-child(2) { animation-delay: .75s; }
  .intro .teamcard > :nth-child(3) { animation-delay: .9s; }
</style>
</head>
<body>
<div id="stage">
  <div class="head">
    <div class="headin">
      <div class="tag">Compositions</div>
      <div class="title kin" id="title"></div>
      <div class="slabs"><i></i><i></i><i></i></div>
    </div>
  </div>
  <div id="board"></div>
</div>

<script src="../assets/commun.js"></script>
<script src="../assets/terrain.js"></script>
<script>
const { $, setText } = SB;
SB.applyLook();

let live = null;       // composition actuelle (régie)
let A = null;          // antenne
let S = null;          // score : sport
let C = null;          // bibliothèque des clubs
let shown = null;
let builtKey = '';
let introTimer = null;

// Silhouette plate (joueur sans photo)
const SILHOUETTE = '<svg viewBox="0 0 100 90" aria-hidden="true"><circle cx="50" cy="30" r="22"/><path d="M8 90 C8 62 26 54 50 54 C74 54 92 62 92 90 Z"/></svg>';

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  return e;
}

function teamVars(node, club) {
  node.style.setProperty('--c', club.color);
  node.style.setProperty('--c2', club.color2);
  node.style.setProperty('--t', SB.textColor(club.color));
}

function crest(club) {
  const c = el('div', 'crest');
  const src = SB.logoUrl(club.logo);
  if (src) { const img = new Image(); img.src = src; c.append(img); } else c.textContent = SB.code(club);
  return c;
}

// Pion d'un joueur (photo, ou silhouette + grand numéro)
function token(o, club, pos, row, col) {
  const t = el('div', 'tok' + (o.player ? '' : ' vacant'));
  t.style.left = pos.left + '%';
  t.style.top = pos.top + '%';
  t.style.setProperty('--row', row);
  t.style.setProperty('--col', col);
  teamVars(t, club);
  const p = o.player;
  const face = el('div', 'face' + (p && p.photo ? ' has' : ''));
  if (p && p.photo) { const img = new Image(); img.src = SB.logoUrl(p.photo); face.append(img); }
  else face.insertAdjacentHTML('beforeend', SILHOUETTE);
  const big = el('b', 'big');
  big.textContent = p ? (p.number || '') : '';
  face.append(big);
  t.append(face);
  const badge = el('b', 'badge');
  badge.textContent = p ? p.number : '';
  t.append(badge);
  if (p && p.captain) { const c = el('i', 'cap'); c.textContent = 'C'; t.append(c); }
  const n = el('div', 'tname');
  n.textContent = p ? (p.last || p.first) : '';
  t.append(n);
  return t;
}

// Rang (ligne) de chaque poste : du gardien (en bas) vers l'attaque, pour l'arrivée en cascade
function rows(slots) {
  const ys = [...new Set(slots.map(s => Math.round(s.y / 8)))].sort((a, b) => b - a);
  return s => ys.indexOf(Math.round(s.y / 8));
}

function benchBox(L, x, y, w, h) {
  const b = el('div', 'bench');
  Object.assign(b.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  teamVars(b, L.club);
  const h3 = el('h3');
  h3.textContent = 'Remplaçants';
  b.append(h3);
  const ul = el('ul');
  const benchSlots = Terrain.place(L.sp, L.formation, L.starters, L.slots).filter(o => o.slot.bench && o.player);
  const list = [...benchSlots.map(o => [o.player, (L.sp.positions.find(p => p.id === o.slot.role) || {}).label]), ...L.subs.map(p => [p, ''])];
  for (const [p, tag] of list) {
    const li = el('li');
    li.innerHTML = '<b class="n"></b><span></span>' + (tag ? '<em></em>' : '');
    li.querySelector('.n').textContent = p.number;
    li.querySelector('span').textContent = SB.fullName(p);
    if (tag) li.querySelector('em').textContent = tag;
    ul.append(li);
  }
  b.append(ul);
  if (L.club.coach) {
    const c = el('div', 'coach');
    c.innerHTML = '<b>Entraîneur</b><span></span>';
    c.querySelector('span').textContent = L.club.coach;
    b.append(c);
  }
  // texte plus petit si la liste est longue
  b.style.setProperty('--bfs', Math.max(14, Math.min(21, Math.floor((h - 140) / Math.max(1, list.length) / 1.6))) + 'px');
  return b;
}

function pitchBox(kind, mode, x, y, w, h) {
  const box = el('div', 'pitchwrap');
  Object.assign(box.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  box.innerHTML = Terrain.svg(kind, mode) + '<div class="slabs"><i></i><i></i><i></i></div>';
  return box;
}

// Plus grand rectangle de rapport r tenant dans w × h
const fit = (r, w, h) => (w / h > r ? [h * r, h] : [w, w / r]);

function buildFace(kind, L) {
  const board = $('board');
  const r = Terrain.ratio(kind, 'full');
  const benchW = 290, gap = 26, top = 236, bottom = 50;
  const [pw, ph] = fit(r, 1920 - 2 * (benchW + gap) - 120, 1080 - top - bottom);
  const px = (1920 - pw) / 2, py = top;
  const pitch = pitchBox(kind, 'full', px, py, pw, ph);
  const tok = Math.max(46, Math.min(84, ph * (L.home && L.home.formation && L.home.formation.slots.length > 11 ? .085 : .1)));
  pitch.style.setProperty('--tok', tok + 'px');

  for (const side of ['home', 'away']) {
    const T = L[side];
    if (!T || !T.formation) continue;
    const placed = Terrain.place(T.sp, T.formation, T.starters, T.slots).filter(o => !o.slot.bench);
    const rowOf = rows(placed.map(o => o.slot));
    placed.forEach((o, k) => pitch.append(token(o, T.club, Terrain.point('full', side, o.slot.x, o.slot.y), rowOf(o.slot), k % 4)));

    // en-tête au-dessus de chaque moitié
    const head = el('div', 'teamhead ' + side);
    teamVars(head, T.club);
    head.append(crest(T.club));
    const txt = el('div');
    txt.innerHTML = '<b></b><small></small>';
    txt.querySelector('b').textContent = T.club.name;
    txt.querySelector('small').textContent = T.formation.label;
    head.append(txt);
    Object.assign(head.style, side === 'home' ? { left: px + 'px', top: (top - 96) + 'px' } : { right: (1920 - px - pw) + 'px', top: (top - 96) + 'px' });
    board.append(head);

    board.append(benchBox(T, side === 'home' ? px - gap - benchW : px + pw + gap, py, benchW, ph));
  }
  board.append(pitch);
}

function buildOne(kind, T) {
  const board = $('board');
  const r = Terrain.ratio(kind, 'half');
  const cardW = 430, benchW = 320, gap = 40, top = 150, bottom = 50;
  const [pw, ph] = fit(r, 1920 - cardW - benchW - 2 * gap - 140, 1080 - top - bottom);
  const total = cardW + gap + pw + gap + benchW;
  const x0 = (1920 - total) / 2;
  const px = x0 + cardW + gap;
  const pitch = pitchBox(kind, 'half', px, top, pw, ph);
  pitch.style.setProperty('--tok', Math.max(56, Math.min(104, ph * (T.formation.slots.length > 11 ? .09 : .11))) + 'px');
  const placed = Terrain.place(T.sp, T.formation, T.starters, T.slots).filter(o => !o.slot.bench);
  const rowOf = rows(placed.map(o => o.slot));
  placed.forEach((o, k) => pitch.append(token(o, T.club, Terrain.point('half', 'home', o.slot.x, o.slot.y), rowOf(o.slot), k % 4)));
  board.append(pitch);

  const card = el('div', 'teamcard');
  teamVars(card, T.club);
  Object.assign(card.style, { left: x0 + 'px', top: (top + 40) + 'px', width: cardW + 'px' });
  card.append(crest(T.club));
  const tn = el('div', 'tn');
  tn.textContent = T.club.name;
  card.append(tn);
  const fo = el('div', 'fo');
  fo.textContent = T.formation.label;
  card.append(fo);
  board.append(card);

  board.append(benchBox(T, px + pw + gap, top, benchW, ph));
}

function build(E) {
  const kind = SB.sport(S.sport).pitch || 'foot';
  const L = { home: SB.lineup(E, C, 'home', S.sport), away: SB.lineup(E, C, 'away', S.sport) };
  $('board').replaceChildren();
  SB.letters($('title'), E.title || 'Feuille de match');
  if (E.layout === 'une') {
    const T = L[E.focus] || L.home || L.away;
    if (T && T.formation) buildOne(kind, T);
  } else if ((L.home && L.home.formation) || (L.away && L.away.formation)) {
    buildFace(kind, L);
  }
}

function update() {
  const E = SB.sceneContent(A, 'equipes', live);
  if (!E || !E.home || !S || !C) return;
  const key = JSON.stringify([E, C, S.sport]);
  if (key !== builtKey) { builtKey = key; build(E); }
  const v = !SB.sport(S.sport).karting && (SB.EDIT ? SB.editVisible('equipes') : !!(A && A[SB.VUE].equipes)) && $('board').children.length > 0;
  if (v === shown) return;
  const first = shown === null;
  shown = v;
  if (first && !v) return;                       // rien à faire disparaître au chargement
  const stage = $('stage');
  clearTimeout(introTimer);
  stage.classList.remove('intro', 'outro');
  for (const e of document.querySelectorAll('.headin, .pitchwrap')) SB.replay(e, v ? 'intro' : 'outro');
  if (v) {
    SB.replay(stage, 'intro');
    // ensuite, plus d'animation à chaque modification
    introTimer = setTimeout(() => document.querySelectorAll('.intro').forEach(e => e.classList.remove('intro')), 4000);
  }
  requestAnimationFrame(() => stage.classList.toggle('on', v));
}

(async () => {
  await SB.loadSports();
  SB.watch('equipes', st => { live = st; update(); });
  SB.watch('clubs', st => { C = st || { clubs: [] }; update(); }, 1000);
  SB.watch('score', st => { S = SB.fixScore(st || SB.newScore()); update(); }, 1000);
  SB.watchScene(a => { A = a; update(); });
  SB.watchLook(() => { builtKey = ''; update(); });
  SB.onEdit(() => update());
})();
</script>
</body>
</html>
