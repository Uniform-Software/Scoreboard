<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay · Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/overlay.css">
<style>
  /* Le style dépend du sport ("layout" dans assets/sports.json), ou du paramètre ?style= :
     barre (football, handball), barre-gauche (rugby), empile (volley), basket. */

  /* ---------- Position (paramètre ?pos=) ---------- */
  #rig { position: absolute; left: 64px; right: 64px; top: 52px; display: flex; transform: translate(var(--score-dx, 0), var(--score-dy, 0)); }
  .pos-haut-centre #rig, .pos-bas-centre #rig { justify-content: center; }
  .pos-haut-droite #rig { justify-content: flex-end; }
  .bottom #rig { top: auto; bottom: 52px; }
  #bug { position: relative; transform: scale(calc(var(--s, 1) * var(--score-s, 1))); transform-origin: top left; --mh: 60px; }
  .no-progress .prog { display: none; }
  .pos-haut-centre #bug { transform-origin: top center; }
  .pos-haut-droite #bug { transform-origin: top right; }
  .pos-haut-droite .banner { left: auto; right: 0; }
  .bottom #bug { transform-origin: bottom left; display: flex; flex-direction: column-reverse; }
  .pos-bas-centre #bug { transform-origin: bottom center; }

  /* ---------- Commun à tous les styles ---------- */
  .mainwrap { position: relative; }
  .main {
    position: relative; overflow: hidden;
    display: flex; align-items: stretch; height: var(--mh);
    background: var(--paper); color: var(--ink);
    border-radius: var(--r);
    clip-path: inset(0 100% 0 0 round var(--r));
    transition: clip-path .15s linear .3s;            /* sortie : se referme sous le volet */
  }
  #bug.on .main { clip-path: inset(0 0 0 0 round var(--r)); transition: clip-path .5s cubic-bezier(.77,0,.18,1) .18s; }


  /* Entrée en cascade du contenu, une fois la barre ouverte (--k : rang, posé par mount()) */
  .main > :not(.prog), .erow > * { opacity: 0; transform: translateY(12px); transition: opacity .15s, transform .15s; }
  #bug.on .main > :not(.prog), #bug.on .erow > * {
    opacity: 1; transform: none;
    transition: opacity .35s, transform .55s cubic-bezier(.2,.9,.2,1);
    transition-delay: calc(.42s + var(--k, 0) * 60ms);
  }
  #bug.on .chip { animation: pop .5s cubic-bezier(.3,1.6,.5,1) calc(.55s + var(--k, 0) * 60ms) both; }

  /* Progression de la période : fin trait d'accent sous la barre */
  .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; z-index: 3; background: rgba(11,11,15,.07); }
  .prog i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .3s linear; }
  .prog.off { display: none; }

  /* But : la barre « bondit », la pastille de l'équipe lance une onde */
  #bug.punch .main { animation: punch .55s cubic-bezier(.3,1.6,.5,1); }
  #bug.on .goal .chip { animation: ring .9s ease-out; }   /* plus précis que le « pop » d'entrée */
  @keyframes punch { 30% { transform: scale(1.035); } }
  @keyframes ring { from { box-shadow: 0 0 0 0 var(--c); } to { box-shadow: 0 0 0 16px transparent; } }

  /* Pastille de couleur d'équipe (comme un drapeau) */
  .chip { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--c); }
  .chip.logo { width: 36px; height: 36px; border-radius: 0; background: none; }   /* blason à la place */
  .chip img { display: block; width: 100%; height: 100%; object-fit: contain; }

  /* Scores : chiffres qui défilent + flash à la couleur de l'équipe */
  .score {
    --digit: var(--paper);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    min-width: 64px; padding: 0 12px;
    background: var(--ink); color: var(--digit);
    font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .digits { position: relative; z-index: 2; display: grid; }
  .digits span { grid-area: 1 / 1; text-align: center; }
  .digits .in  { animation: rollIn .5s cubic-bezier(.2,.9,.2,1); }
  .digits .out { animation: rollOut .5s cubic-bezier(.6,0,.8,.3) forwards; }
  .digits.dn .in  { animation-name: rollInDn; }
  .digits.dn .out { animation-name: rollOutDn; }
  .score .fx { position: absolute; inset: 0; z-index: 1; background: var(--c); transform: scaleY(0); transform-origin: bottom; }
  .score.flash .fx { animation: fx .9s cubic-bezier(.3,0,.2,1); }
  .score .fx::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.25) 0 4px, transparent 4px 12px); animation: hatch .9s linear infinite; }
  .score.flash .digits { animation: digitsFlash .9s; }

  .serve { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
  .serve.on { transform: scale(1); }

  .clock { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; color: inherit; }
  .clock.word { font-size: 18px; font-weight: 700; font-stretch: 125%; letter-spacing: .08em; text-transform: uppercase; }
  .clock.zero { animation: blink 1s steps(2) infinite; }

  /* Onglets sous la barre (période, temps additionnel, balle de set) */
  .tabs { position: relative; height: 34px; overflow: hidden; display: flex; justify-content: flex-end; gap: 4px; padding: 0 var(--r); }
  .tab {
    display: flex; align-items: center; height: 30px; padding: 0 14px;
    font-size: 14px; font-weight: 700; font-stretch: 125%; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
    border-radius: 0 0 8px 8px;
    transform: translateY(-110%);
    transition: transform .3s cubic-bezier(.6,0,.4,1);
  }
  #bug.on .tab.show { transform: none; transition: transform .45s cubic-bezier(.2,.9,.2,1) .75s; }
  .tab.period { background: var(--ink); color: var(--paper); }
  .tab.added { background: var(--hot); color: #fff; }
  .tab.alert { position: absolute; top: 0; background: var(--accent); color: var(--on-accent); animation: alertPulse 1.2s ease-in-out infinite; }
  .flip { animation: flip .5s ease; }

  /* Exclusions temporaires (carton jaune au rugby, 2 min au handball), sous l'équipe */
  .bins { position: absolute; top: 0; display: flex; gap: 4px; }
  .bin {
    display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 10px;
    background: var(--ink); color: var(--paper); border-radius: 0 0 8px 8px;
    font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
    transform: translateY(-110%); transition: transform .3s cubic-bezier(.6,0,.4,1);
  }
  .bin i { width: 11px; height: 15px; border-radius: 2px; background: var(--bc); }
  .bin b { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 700; font-stretch: 75%; text-transform: uppercase; }
  .bin b:empty { display: none; }
  #bug.on .bin.show { transform: none; transition: transform .45s cubic-bezier(.2,.9,.2,1); }
  .bottom .bins { top: auto; bottom: 0; }
  .bottom .bin { transform: translateY(110%); border-radius: 8px 8px 0 0; }
  .bottom .tabs { align-items: flex-end; }
  .bottom .tab { transform: translateY(110%); border-radius: 8px 8px 0 0; }

  /* Bandeau d'action (BUT !, ESSAI !, SET…) : aplat à la couleur de l'équipe */
  .banner {
    position: absolute; left: 0; min-width: 100%; width: max-content; top: calc(var(--mh) + 6px); z-index: 6;   /* peut déborder si le scoreboard est compact */
    display: flex; align-items: center; gap: 18px; height: 60px; padding: 0 8px; overflow: hidden;
    background: var(--c); color: var(--t);
    border-radius: var(--r);
    clip-path: inset(0 0 100% 0 round var(--r));
    transition: clip-path .35s cubic-bezier(.7,0,.3,1);
  }
  .banner.show { clip-path: inset(0 0 0 0 round var(--r)); transition: clip-path .45s cubic-bezier(.2,.9,.2,1); }
  .bottom .banner { top: auto; bottom: calc(var(--mh) + 6px); clip-path: inset(100% 0 0 0 round var(--r)); }
  .bottom .banner.show { clip-path: inset(0 0 0 0 round var(--r)); }
  .banner { --slab: var(--c); }
  .banner .b-hatch { position: absolute; top: 0; bottom: 0; right: 0; width: 45%; color: var(--t); opacity: .12; }
  .b-crest {
    position: relative; flex: none; display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 9px; background: var(--paper); color: var(--ink);
    font-size: 15px; font-weight: 900; font-stretch: 125%; overflow: hidden;
    transform: scale(0);
  }
  .b-crest img { width: 34px; height: 34px; object-fit: contain; }
  .banner.show .b-crest { animation: pop .5s cubic-bezier(.3,1.6,.5,1) .45s both; }
  .banner.show .rise > * { transform: none; transition: transform .6s cubic-bezier(.2,.9,.2,1) .55s; }
  .b-label {
    position: relative; display: flex; align-items: center; height: 44px; padding: 0 18px;
    background: var(--paper); color: var(--ink); border-radius: 8px;
    font-size: 30px; font-weight: 900; text-transform: uppercase; white-space: nowrap;
    transform: scaleX(0); transform-origin: left;
    transition: transform .2s;
    --d: .6s;                                            /* départ des lettres */
  }
  .b-team, .b-score { position: relative; font-size: 30px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
  .b-score { opacity: 0; transform: translateX(-20px); transition: opacity .3s, transform .3s; }
  .b-team { flex: 1; font-stretch: 75%; font-size: 34px; }
  .b-score { padding-right: 14px; font-variant-numeric: tabular-nums; }
  .b-min {
    position: relative; display: flex; align-items: center; height: 40px; padding: 0 12px;
    font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums;
    border-radius: 8px; box-shadow: inset 0 0 0 2px currentColor;
    opacity: 0; transition: opacity .3s;
  }
  .b-min:empty { display: none; }
  .banner.show .b-min { opacity: 1; transition: opacity .4s .7s; }
  .banner.show .b-label { transform: none; transition: transform .45s cubic-bezier(.77,0,.18,1) .4s; }
  .banner.show .b-score { opacity: 1; transform: none; transition: opacity .4s .8s, transform .5s cubic-bezier(.2,.9,.2,1) .8s; }

  /* ---------- Style « barre » (football, handball) et « barre-gauche » (rugby) ---------- */
  .team { display: flex; align-items: center; gap: 12px; padding: 0 20px 0 16px; }
  .team.away { flex-direction: row-reverse; padding: 0 16px 0 20px; }
  /* Les deux blocs contiennent les DEUX noms superposés (un invisible) : ils ont toujours la même largeur */
  .tname { display: grid; font-size: 32px; font-weight: 800; font-stretch: 75%; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }
  .tname span { grid-area: 1 / 1; }
  .away .tname { text-align: right; }
  .tname .ghost { visibility: hidden; }
  .sets {
    display: none; min-width: 32px; height: 32px; padding: 0 8px; line-height: 32px; text-align: center;
    font-size: 22px; font-weight: 800; color: var(--on-accent); background: var(--accent); border-radius: 7px;
  }
  .volley .sets { display: block; }
  .score + .score { box-shadow: inset 2px 0 0 var(--paper); }
  .clockbox {
    display: flex; align-items: center; justify-content: center;
    min-width: 124px; padding: 0 18px;
    background: var(--accent); color: var(--on-accent);
  }
  /* Cartons rouges (football) */
  .cards { display: flex; gap: 4px; }
  .cards:empty { display: none; }
  .cards i { width: 12px; height: 17px; background: var(--hot); border-radius: 2px; }
  .cards i.new { animation: card .6s cubic-bezier(.3,1.6,.5,1); }

  /* Rugby : chrono à gauche, onglets alignés à gauche */
  .barre-gauche .clockbox { order: -1; }
  .barre-gauche .tabs { justify-content: flex-start; }

  /* ---------- Style « empile » (volley) : une ligne par équipe ---------- */
  #bug.empile { --mh: 92px; }
  .empile .main { display: grid; grid-template-columns: auto auto 28px auto auto auto; grid-auto-rows: 46px; }
  .erow { display: contents; }
  .erow > * { display: flex; align-items: center; justify-content: center; }
  .erow.home > * { box-shadow: inset 0 -1px 0 var(--mist); }
  .erow.home > .score { box-shadow: inset 0 -2px 0 var(--paper); }
  .estrip { padding-left: 14px; }
  .estrip .chip { width: 22px; height: 22px; border-radius: 6px; }
  .estrip .chip.logo { width: 30px; height: 30px; border-radius: 0; }
  .ename { justify-content: flex-start; padding: 0 14px 0 12px; font-size: 28px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; white-space: nowrap; }
  .esets { min-width: 44px; padding: 0 10px; font-size: 26px; font-weight: 800; color: var(--on-accent); background: var(--accent); }
  .erow.home > .esets { box-shadow: inset 0 -2px 0 var(--paper); }
  .ehist i { width: 40px; text-align: center; font-style: normal; font-size: 20px; font-weight: 600; color: var(--mute); font-variant-numeric: tabular-nums; }
  .ehist i.won { color: var(--ink); font-weight: 800; }
  .empile .score { min-width: 70px; font-size: 32px; }
  .empile .tabs { justify-content: flex-start; }
  .empile .tab.alert { position: static; }

  /* ---------- Style « basket » : barre large en bas de l'écran ---------- */
  #bug.basket { --mh: 72px; }
  .basket .main { background: var(--ink); color: var(--paper); }
  .bteam {
    width: 260px; padding: 0 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: var(--c); color: var(--t);
  }
  .bname { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 32px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; line-height: 1; }
  .bfouls { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; font-stretch: 125%; letter-spacing: .1em; text-transform: uppercase; }
  .bfouls i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .3; transition: opacity .3s; }
  .bfouls i.on { opacity: 1; }
  .bfouls b { display: none; margin-left: 4px; padding: 1px 6px; border-radius: 4px; background: var(--paper); color: var(--ink); }
  .bfouls.bonus b { display: inline-block; animation: card .5s cubic-bezier(.3,1.6,.5,1); }
  .basket .score { --digit: var(--ink); min-width: 96px; font-size: 50px; background: var(--paper); }
  .basket .score + .score, .basket .score { box-shadow: none; }
  .basket .prog { background: rgba(255,255,255,.12); }
  .bmid { display: flex; align-items: stretch; }
  .bclock { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 150px; padding: 0 16px; }
  .bper { font-size: 13px; font-weight: 700; font-stretch: 125%; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  .basket .clock { font-size: 36px; line-height: 1; }
  .basket .clock.low { color: var(--hot); }
  .bshot {
    display: flex; align-items: center; justify-content: center; width: 68px;
    font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--on-accent); background: var(--accent);
    transition: background .2s, color .2s;
  }
  .bshot.low { background: var(--hot); color: #fff; }
  .bshot.zero { animation: blink .6s steps(2) infinite; }
  .bshot.off { background: #22232a; color: rgba(255,255,255,.3); }

  @keyframes rollIn    { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rollOut   { from { transform: none; opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
  @keyframes rollInDn  { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rollOutDn { from { transform: none; opacity: 1; } to { transform: translateY(100%); opacity: 0; } }
  @keyframes fx {
    0%   { transform: scaleY(0); opacity: 1; }
    30%  { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(1); opacity: 0; }
  }
  @keyframes digitsFlash { 0%, 50% { color: var(--t); } 100% { color: var(--digit); } }
  @keyframes flip { 0% { transform: rotateX(90deg); } 100% { transform: none; } }
  @keyframes alertPulse { 50% { opacity: .7; } }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes card { from { transform: scale(2.2) rotate(-20deg); opacity: 0; } }
</style>
</head>
<body>
<div id="rig"></div>

<!-- ===== Style « barre » : football, handball (et rugby avec le chrono à gauche) ===== -->
<template id="tpl-barre">
  <div id="bug">
    <div class="mainwrap">
      <div class="main">
        <div class="team home" id="home">
          <div class="chip" id="homeChip"></div>
          <div class="tname"><span id="homeName"></span><span class="ghost" id="homeGhost"></span></div>
          <div class="cards" id="homeCards"></div>
          <div class="serve" id="homeServe"></div>
          <div class="sets" id="homeSets">0</div>
        </div>
        <div class="score" id="homeScoreBox"><div class="fx"></div><div class="digits" id="homeScore"></div></div>
        <div class="score" id="awayScoreBox"><div class="fx"></div><div class="digits" id="awayScore"></div></div>
        <div class="team away" id="away">
          <div class="chip" id="awayChip"></div>
          <div class="tname"><span id="awayName"></span><span class="ghost" id="awayGhost"></span></div>
          <div class="cards" id="awayCards"></div>
          <div class="serve" id="awayServe"></div>
          <div class="sets" id="awaySets">0</div>
        </div>
        <div class="clockbox"><div class="clock" id="clock">00:00</div></div>
        <div class="prog" id="prog"><i></i></div>
      </div>
      <div class="slabs"><i></i><i></i><i></i></div>
    </div>
    <div class="tabs">
      <div class="bins" id="homeBins"></div>
      <div class="bins" id="awayBins"></div>
      <div class="tab alert" id="alert"></div>
      <div class="tab period" id="period"></div>
      <div class="tab added" id="added"></div>
    </div>
  </div>
</template>

<!-- ===== Style « empile » : volley (une ligne par équipe, scores des sets joués) ===== -->
<template id="tpl-empile">
  <div id="bug">
    <div class="mainwrap">
      <div class="main">
        <div class="erow home" id="home">
          <div class="estrip"><div class="chip" id="homeChip"></div></div>
          <div class="ename" id="homeName"></div>
          <div><div class="serve" id="homeServe"></div></div>
          <div class="esets" id="homeSets">0</div>
          <div class="ehist" id="homeHist"></div>
          <div class="score" id="homeScoreBox"><div class="fx"></div><div class="digits" id="homeScore"></div></div>
        </div>
        <div class="erow away" id="away">
          <div class="estrip"><div class="chip" id="awayChip"></div></div>
          <div class="ename" id="awayName"></div>
          <div><div class="serve" id="awayServe"></div></div>
          <div class="esets" id="awaySets">0</div>
          <div class="ehist" id="awayHist"></div>
          <div class="score" id="awayScoreBox"><div class="fx"></div><div class="digits" id="awayScore"></div></div>
        </div>
      </div>
      <div class="slabs"><i></i><i></i><i></i></div>
    </div>
    <div class="tabs">
      <div class="tab period" id="period"></div>
      <div class="tab alert" id="alert"></div>
    </div>
  </div>
</template>

<!-- ===== Style « basket » : barre large, fautes d'équipe et horloge des tirs ===== -->
<template id="tpl-basket">
  <div id="bug">
    <div class="mainwrap">
      <div class="main">
        <div class="bteam home" id="home"><div class="bname" id="homeName"></div><div class="bfouls" id="homeFouls"></div></div>
        <div class="score" id="homeScoreBox"><div class="fx"></div><div class="digits" id="homeScore"></div></div>
        <div class="bmid">
          <div class="bclock"><div class="bper" id="period"></div><div class="clock" id="clock">10:00</div></div>
          <div class="bshot" id="shot"></div>
        </div>
        <div class="score" id="awayScoreBox"><div class="fx"></div><div class="digits" id="awayScore"></div></div>
        <div class="bteam away" id="away"><div class="bname" id="awayName"></div><div class="bfouls" id="awayFouls"></div></div>
        <div class="prog" id="prog"><i></i></div>
      </div>
      <div class="slabs"><i></i><i></i><i></i></div>
    </div>
  </div>
</template>

<!-- Bandeau d'action, ajouté à chaque style -->
<template id="tpl-banner">
  <div class="banner" id="banner">
    <div class="b-hatch hatch"></div>
    <div class="b-crest" id="bCrest"></div>
    <div class="b-label kin" id="bLabel"></div>
    <div class="b-team rise"><span id="bTeam"></span></div>
    <div class="b-min" id="bMin"></div>
    <div class="b-score" id="bScore"></div>
    <div class="slabs"><i></i><i></i><i></i></div>
  </div>
</template>

<script src="../assets/commun.js"></script>
<script>
const { $, setText } = SB;
const STYLES = ['barre', 'barre-gauche', 'empile', 'basket'];
const DEFAULT_POS = { basket: 'bas-centre' };
SB.applyLook();

let S = null;
let A = null;            // antenne : le scoreboard est-il à l'antenne ?
let layout = null;       // style affiché
let shown = false;
let lastEvent = null;      // « id|marqueur » de la dernière action de score
const STATUS = { ht: 'Mi-temps', ft: 'Fin', pause: 'Pause' };
let bannerTimer = null;

// Élément facultatif : tous les styles n'ont pas tous les éléments
const opt = id => document.getElementById(id);
const put = (id, text) => { const el = opt(id); if (el) setText(el, text); };

// ---------- Construction du style ----------
function mount(name) {
  layout = name;
  const node = $('tpl-' + (name === 'barre-gauche' ? 'barre' : name)).content.cloneNode(true);
  node.querySelector('#bug').append($('tpl-banner').content.cloneNode(true));
  $('rig').replaceChildren(node);
  $('bug').classList.add(name);
  // rang de chaque bloc pour l'entrée en cascade
  $('bug').querySelectorAll('.main > :not(.prog), .erow > *').forEach((el, k) => el.style.setProperty('--k', k));
  const pos = SB.params.get('pos') || DEFAULT_POS[name] || 'haut-gauche';
  document.body.className = 'pos-' + pos + (pos.startsWith('bas') ? ' bottom' : '');
  shown = false;
  clearTimeout(bannerTimer);
}

// ---------- Entrée / sortie animées ----------
function setVisible(v) {
  if (v === shown) return;
  shown = v;
  const wrap = $('bug').querySelector('.mainwrap');
  wrap.classList.remove('intro', 'outro');
  SB.replay(wrap, v ? 'intro' : 'outro');     // plaques en cascade
  $('bug').classList.toggle('on', v);
  if (!v) hideBanner();
}

// ---------- Score qui défile ----------
function roll(id, value, animate) {
  const box = $(id);
  const cur = box.querySelector('span:not(.out)');
  if (cur && cur.textContent === String(value)) return;
  const s = document.createElement('span');
  s.textContent = value;
  box.querySelectorAll('.out').forEach(x => x.remove());
  if (!animate || !cur) { box.replaceChildren(s); return; }
  box.classList.toggle('dn', value < Number(cur.textContent));
  cur.className = 'out';
  s.className = 'in';
  box.append(s);
  setTimeout(() => cur.remove(), 520);
  if (value > Number(cur.textContent)) {
    SB.replay(box.parentElement, 'flash');      // la case se remplit à la couleur de l'équipe
    SB.replay($('bug'), 'punch');               // la barre bondit
    const side = id.startsWith('home') ? 'home' : 'away';
    SB.replay($(side), 'goal');                 // onde autour de la pastille
  }
}

// ---------- Détails propres à chaque sport ----------
function renderCards(el, n, animate) {           // cartons rouges
  while (el.children.length > n) el.lastElementChild.remove();
  while (el.children.length < n) {
    const i = document.createElement('i');
    if (animate) i.className = 'new';
    el.append(i);
  }
}

function renderFouls(el, n) {                     // fautes d'équipe : 5 points, puis « bonus »
  if (!el.children.length) el.innerHTML = 'Fautes <i></i><i></i><i></i><i></i><i></i><b>Bonus</b>';
  el.querySelectorAll('i').forEach((dot, k) => dot.classList.toggle('on', k < n));
  el.classList.toggle('bonus', n >= 5);
}

function renderChip(el, team) {                  // pastille de couleur, ou blason si un logo est renseigné
  const src = SB.look().options.crests ? SB.logoUrl(team.logo) : '';    // option « blasons » de l'habillage
  if (el.dataset.src === src) return;
  el.dataset.src = src;
  el.classList.toggle('logo', !!src);
  el.replaceChildren();
  if (src) {
    const img = new Image();
    img.src = src;
    img.onerror = () => { el.classList.remove('logo'); img.remove(); };
    el.append(img);
  }
}

// Exclusions temporaires : une étiquette par joueur exclu, avec le temps restant
function renderBins(side, sp) {
  const box = opt(side + 'Bins');
  if (!box) return;
  const list = sp.sinbin ? S.sinbins.filter(x => x.team === side && SB.sinbinLeft(S, x) > 0) : [];
  const ids = list.map(x => String(x.id));
  for (const el of [...box.children]) {
    if (!ids.includes(el.dataset.id)) { el.classList.remove('show'); setTimeout(() => el.remove(), 350); el.dataset.id = ''; }
  }
  for (const x of list) {
    let el = box.querySelector(`[data-id="${x.id}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'bin';
      el.dataset.id = x.id;
      el.innerHTML = '<i></i><b></b><span></span>';
      el.style.setProperty('--bc', sp.sinbin.color);
      box.append(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    }
    setText(el.querySelector('b'), x.player ? SB.shortName(x.player) : '');
    setText(el.querySelector('span'), SB.fmt(SB.sinbinLeft(S, x) + 999));
  }
  const team = $(side);                            // sous l'équipe : aligné à gauche, ou à droite pour l'équipe de droite
  box.style.left = (side === 'home' ? team.offsetLeft : team.offsetLeft + team.offsetWidth - box.offsetWidth) + 'px';
}

function renderHist(el, side) {                   // scores des sets déjà joués
  const key = JSON.stringify(S.history);
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.replaceChildren(...S.history.map(([h, a]) => {
    const i = document.createElement('i');
    const mine = side === 'home' ? h : a, other = side === 'home' ? a : h;
    i.textContent = mine;
    if (mine > other) i.className = 'won';
    return i;
  }));
}

// ---------- Bandeau ----------
// Bandeau : « BUT ! · K. MBAPPÉ · 23' · 2 – 1 ». Si le marqueur est choisi après coup,
// le bandeau déjà affiché est mis à jour et reste un peu plus longtemps.
function showBanner(ev, replay = true) {
  const t = S[ev.team];
  const b = $('banner');
  b.style.setProperty('--c', t.color);
  b.style.setProperty('--t', SB.textColor(t.color));
  SB.letters($('bLabel'), ev.label + (ev.label.length <= 6 ? ' !' : ''));
  setText('bTeam', ev.player ? SB.shortName(ev.player) : t.name);
  const crest = $('bCrest');                    // blason, ou abréviation de l'équipe
  const src = SB.logoUrl(t.logo);
  if (crest.dataset.src !== src + SB.code(t)) {
    crest.dataset.src = src + SB.code(t);
    crest.replaceChildren();
    if (src) { const img = new Image(); img.src = src; crest.append(img); } else crest.textContent = SB.code(t);
  }
  setText('bMin', ev.minute);
  setText('bScore', SB.sport(S.sport).sets ? `${S.home.sets} – ${S.away.sets}` : `${S.home.score} – ${S.away.score}`);
  if (replay) { b.classList.remove('intro'); SB.replay(b, 'show'); SB.replay(b, 'intro'); }
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(hideBanner, SB.look().options.bannerSec * 1000);
}
function hideBanner() { const b = opt('banner'); if (b) b.classList.remove('show'); }

// ---------- Onglets ----------
function setTab(id, text, show) {
  const el = opt(id);
  if (!el) return;
  if (show && el.textContent !== text) {
    const changed = el.textContent !== '' && el.classList.contains('show');
    el.textContent = text;
    if (changed) { el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); }
  }
  el.classList.toggle('show', !!show);
}

// ---------- Rendu ----------
// À l'antenne ? (ou à l'aperçu avec ?vue=apercu)
// en karting, le classement (overlay/karting.html) remplace le scoreboard
const onAir = () => !(S && SB.sport(S.sport).karting) && (SB.EDIT ? SB.editVisible('score') : !!(A && A[SB.VUE].score));

function apply(state) {
  SB.fixScore(state);
  const sp = SB.sport(state.sport);
  const wanted = SB.params.get('style');
  const name = STYLES.includes(wanted) ? wanted : STYLES.includes(sp.layout) ? sp.layout : 'barre';
  let first = !S;
  if (name !== layout) { mount(name); first = true; }
  S = state;
  $('bug').classList.toggle('volley', !!sp.sets);

  for (const side of ['home', 'away']) {
    const t = S[side];
    for (const id of [side, side + 'ScoreBox']) {
      $(id).style.setProperty('--c', t.color);
      $(id).style.setProperty('--t', SB.textColor(t.color));
    }
    put(side + 'Name', SB.teamLabel(S, side));
    put(side + 'Sets', t.sets);
    if (opt(side + 'Chip')) renderChip($(side + 'Chip'), t);
    roll(side + 'Score', t.score, !first);
    if (opt(side + 'Serve')) $(side + 'Serve').classList.toggle('on', !!sp.sets && S.serve === side);
    if (opt(side + 'Cards')) renderCards($(side + 'Cards'), sp.cards ? t.cards : 0, !first);
    if (opt(side + 'Fouls')) renderFouls($(side + 'Fouls'), t.fouls);
    if (opt(side + 'Hist')) renderHist($(side + 'Hist'), side);
  }
  put('homeGhost', SB.teamLabel(S, 'away'));   // nom invisible de l'autre équipe : égalise les largeurs
  put('awayGhost', SB.teamLabel(S, 'home'));

  // Nouvelle action de score : bandeau (jamais au premier affichage)
  const ev = S.event, key = ev.id + '|' + ev.player;
  if (lastEvent === null) lastEvent = key;
  else if (key !== lastEvent) {
    const sameEvent = lastEvent.split('|')[0] === String(ev.id);
    lastEvent = key;
    const showing = $('banner').classList.contains('show');
    if (ev.team && onAir() && SB.look().options.banner && (!sameEvent || showing)) showBanner(ev, !sameEvent);
  }

  setVisible(onAir());
  tick();
}

// Chrono, horloge des tirs et onglets, 10 fois par seconde
function tick() {
  if (!S) return;
  const sp = SB.sport(S.sport);
  const p = SB.period(S);
  let text, word = false, low = false, zero = false;

  if (sp.sets) {
    const v = SB.volley(S);
    text = v.winner ? 'Fin' : 'Set ' + v.set;
    word = true;
    const alert = v.winner ? '' : v.matchPoint ? 'Balle de match' : v.setPoint ? 'Balle de set' : '';
    if (alert && layout !== 'empile') $('alert').style.left = $(v.setPoint).offsetLeft + 'px';
    setTab('alert', alert, !!alert);
    setTab('period', v.winner ? 'Fin du match' : 'Set ' + v.set, layout === 'empile');
    setTab('added', '', false);
  } else {
    if (SB.hasClock(S)) {
      const ms = SB.clockMs(S);
      const down = sp.clock === 'down';
      text = SB.fmt(ms, down);
      low = down && ms < 60000 && ms > 0;
      zero = down && ms === 0;
    } else {
      text = p ? p.short : '';         // période sans chrono (ex. tirs au but)
      word = true;
    }
    if (S.status) { text = STATUS[S.status]; word = true; low = zero = false; }   // MI-TEMPS, FIN…
    setTab('alert', '', false);
    setTab('period', p ? p.short : '', !!p && SB.hasClock(S));
    setTab('added', '+' + S.added, sp.added && S.added > 0 && SB.hasClock(S));
  }

  for (const side of ['home', 'away']) renderBins(side, sp);

  // Progression de la période
  const prog = opt('prog');
  if (prog) {
    const on = !sp.sets && SB.hasClock(S) && !S.status;
    prog.classList.toggle('off', !on);
    if (on) {
      const len = p.len * 60000, ms = SB.clockMs(S);
      const k = sp.clock === 'down' ? 1 - ms / len : (ms - SB.periodStart(S.sport, S.period)) / len;
      prog.style.setProperty('--p', Math.max(0, Math.min(1, k)).toFixed(4));
    }
  }

  const clock = opt('clock');
  if (clock) {
    setText(clock, text);
    clock.className = 'clock' + (word ? ' word' : '') + (low ? ' low' : '') + (zero ? ' zero' : '');
  }

  // Horloge des tirs : éteinte quand il reste moins de temps de jeu que de temps de tir
  const shot = opt('shot');
  if (shot) {
    const ms = SB.shotMs(S), game = SB.clockMs(S);
    const off = !sp.shot || !SB.hasClock(S) || game === 0 || ms > game + 50;
    setText(shot, off ? '—' : ms < 5000 ? (Math.floor(ms / 100) / 10).toFixed(1) : Math.ceil(ms / 1000));
    shot.className = 'bshot' + (off ? ' off' : ms <= 5000 ? ' low' : '') + (!off && ms === 0 ? ' zero' : '');
  }
}

(async () => {
  await SB.loadSports();
  SB.watch('score', st => apply(st || SB.newScore()));   // aucun match enregistré : valeurs par défaut
  SB.watchScene(a => { A = a; if (S) apply(S); });
  SB.watchLook(() => { if (S) { $('rig').querySelectorAll('[data-src]').forEach(el => { el.dataset.src = '-'; }); apply(S); } });
  SB.onEdit(() => { if (S) apply(S); });
  setInterval(tick, 100);
})();
</script>
