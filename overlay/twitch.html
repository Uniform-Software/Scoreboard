<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay · Twitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/overlay.css">
<style>
  /* Tchat (en bas à gauche) et alertes (en haut au centre) de la chaîne Twitch réglée dans l'onglet Habillage.
     ?mode=tchat ou ?mode=alertes pour n'en garder qu'un (une source OBS chacun) ; ?chaine=nom pour forcer la chaîne. */

  /* ---------- Tchat ---------- */
  .chat { position: absolute; left: 64px; bottom: 64px; width: 560px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; max-height: 900px; overflow: hidden; }
  .msg { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px 18px 14px; border-radius: var(--r); background: var(--paper); color: var(--ink);
    border-left: 8px solid var(--uc, var(--accent)); animation: msgIn .55s cubic-bezier(.2,.9,.2,1) both; transform-origin: left bottom; }
  .msg.out { animation: msgOut .35s cubic-bezier(.7,0,.3,1) both; }
  @keyframes msgIn { from { opacity: 0; transform: translateX(-60px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes msgOut { to { opacity: 0; transform: translateX(-60px); } }
  .who { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; font-stretch: 87.5%; text-transform: uppercase; color: var(--uc, var(--accent)); white-space: nowrap; }
  .who i { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; font-style: normal; font-size: 13px; font-weight: 900; font-stretch: 100%; color: #fff; }
  .who i.b { background: #e91916; } .who i.m { background: #00ad03; } .who i.v { background: #e005b9; } .who i.s { background: var(--accent); color: var(--on-accent); }
  .txt { font-size: 26px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .txt.me { font-style: italic; color: var(--uc, var(--ink)); }
  .txt img { height: 1.4em; vertical-align: -.35em; margin: 0 1px; }

  /* ---------- Alertes ---------- */
  .alert { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 760px; visibility: hidden; }
  .alert.on, .alert.leaving { visibility: visible; }
  .a-tag { display: flex; align-items: center; gap: 14px; padding: 10px 26px; border-radius: 10px; background: var(--ink); color: var(--paper);
    font-size: 22px; font-weight: 700; font-stretch: 125%; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap;
    opacity: 0; transform: translateY(20px); transition: opacity .2s, transform .2s; }
  .alert.on .a-tag { opacity: 1; transform: none; transition: opacity .4s .5s, transform .6s cubic-bezier(.2,.9,.2,1) .5s; }
  .a-tag .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .a-body { position: relative; overflow: hidden; display: flex; align-items: stretch; min-width: 760px; border-radius: 18px; background: var(--accent); color: var(--on-accent); --slab: var(--accent);
    clip-path: inset(0 50% 0 50% round 18px); transition: clip-path .3s cubic-bezier(.7,0,.3,1) .1s; }
  .alert.on .a-body { clip-path: inset(0 0 0 0 round 18px); transition: clip-path .6s cubic-bezier(.77,0,.18,1); }
  .a-icon { display: grid; place-items: center; width: 150px; background: var(--ink); color: var(--paper); font-size: 64px; font-weight: 900; font-stretch: 75%; }
  .a-main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 22px 40px 24px 34px; }
  .a-name { font-size: 86px; font-weight: 900; font-stretch: 75%; text-transform: uppercase; line-height: .95; white-space: nowrap; }
  .a-sub { font-size: 26px; font-weight: 700; font-stretch: 125%; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; opacity: .85; }
  .a-sub:empty { display: none; }
  .a-hatch { width: 46px; color: var(--on-accent); opacity: .3; }
  .a-msg { max-width: 900px; padding: 12px 24px; border-radius: 10px; background: var(--paper); color: var(--ink); font-size: 26px; font-weight: 600; text-align: center;
    opacity: 0; transform: translateY(-14px); transition: opacity .2s, transform .2s; }
  .a-msg:empty { display: none; }
  .alert.on .a-msg { opacity: 1; transform: none; transition: opacity .4s .8s, transform .6s cubic-bezier(.2,.9,.2,1) .8s; }

  body.m-tchat .alert, body.m-alertes .chat { display: none; }
</style>
</head>
<body>
<div class="chat" id="chat"></div>

<div class="alert" id="alert">
  <div class="a-tag"><i class="dot"></i><span id="aTag"></span></div>
  <div class="a-body" id="aBody">
    <div class="a-icon" id="aIcon"></div>
    <div class="a-main"><div class="a-name kin" id="aName"></div><div class="a-sub" id="aSub"></div></div>
    <i class="a-hatch hatch"></i>
    <div class="slabs"><i></i><i></i><i></i></div>
  </div>
  <div class="a-msg" id="aMsg"></div>
</div>

<script src="../assets/commun.js"></script>
<script src="../assets/twitch.js"></script>
<script>
'use strict';
const { $, setText } = SB;
SB.applyLook();
const MODE = SB.params.get('mode') || 'tout';
document.body.classList.add('m-' + MODE);
let T = SB.lookDefaults().twitch;          // réglages (onglet Habillage)

// ---------- Tchat ----------
const BADGES = { broadcaster: ['b', '▶'], moderator: ['m', 'M'], vip: ['v', '◆'], subscriber: ['s', '★'], founder: ['s', '★'] };
const bots = () => T.bots.toLowerCase().split(/[\s,;]+/).filter(Boolean);

function addMessage(ev) {
  if (T.hideCmd && /^!/.test(ev.text)) return;
  if (bots().includes(ev.login)) return;
  const el = document.createElement('div');
  el.className = 'msg';
  el.dataset.id = ev.id || '';
  el.dataset.login = ev.login || '';
  if (/^#[0-9a-f]{6}$/i.test(ev.color)) el.style.setProperty('--uc', ev.color);
  const who = document.createElement('div');
  who.className = 'who';
  for (const b of ev.badges) if (BADGES[b]) { const i = document.createElement('i'); i.className = BADGES[b][0]; i.textContent = BADGES[b][1]; who.append(i); }
  who.append(ev.user);
  const txt = document.createElement('div');
  txt.className = 'txt' + (ev.action ? ' me' : '');
  for (const p of ev.parts) {
    if (p.emote) { const img = new Image(); img.src = p.emote; img.alt = p.alt; txt.append(img); }
    else txt.append(p.text);
  }
  el.append(who, txt);
  $('chat').append(el);
  // au-delà du maximum : les plus anciens partent
  const all = [...$('chat').querySelectorAll('.msg:not(.out)')];
  for (const old of all.slice(0, Math.max(0, all.length - T.max))) removeMsg(old);
  if (T.fade > 0) setTimeout(() => removeMsg(el), T.fade * 1000);
}
function removeMsg(el) {
  if (!el.isConnected || el.classList.contains('out')) return;
  el.classList.add('out');
  setTimeout(() => el.remove(), 400);
}

// ---------- Alertes (une à la fois, dans l'ordre d'arrivée) ----------
const queue = [];
let busy = false;
const ALERTS = {
  sub:  ev => ['Nouvel abonné', '★', ev.user, ev.months > 1 ? `${ev.months} mois d'abonnement` : 'Bienvenue !', ev.text || ''],
  gift: ev => ['Abonnements offerts', '🎁', ev.user, ev.count > 1 ? `offre ${ev.count} abonnements` : `offre un abonnement${ev.to ? ' à ' + ev.to : ''}`, ''],
  raid: ev => ['Raid', '⚑', ev.user, `arrive avec ${ev.viewers} spectateur${ev.viewers > 1 ? 's' : ''}`, ''],
  bits: ev => ['Bits', '◆', ev.user, `${ev.amount} bits`, (ev.text || '').replace(/\b\w+\d+\b/g, '').trim()]
};
function wanted(ev) {
  if (!ALERTS[ev.type]) return false;
  if (!T.alerts[ev.type]) return false;
  return ev.type !== 'bits' || ev.amount >= T.minBits;
}
async function next() {
  if (busy || !queue.length) return;
  busy = true;
  const ev = queue.shift();
  const [tag, icon, name, sub, msg] = ALERTS[ev.type](ev);
  setText('aTag', tag);
  setText('aIcon', icon);
  SB.letters($('aName'), name);
  setText('aSub', sub);
  setText('aMsg', msg.slice(0, 140));
  // nom très long : réduit pour tenir
  $('aName').style.fontSize = '';
  const al = $('alert');
  al.classList.remove('leaving');
  $('aBody').classList.remove('outro');
  SB.replay($('aBody'), 'intro');
  al.classList.add('on');
  await SB.sleep(60);
  let size = 86;
  while (size > 40 && $('aName').scrollWidth > 1100) { size -= 4; $('aName').style.fontSize = size + 'px'; }
  await SB.sleep(6000);
  $('aBody').classList.remove('intro');
  SB.replay($('aBody'), 'outro');
  al.classList.add('leaving');
  al.classList.remove('on');
  await SB.sleep(900);
  al.classList.remove('leaving');
  busy = false;
  next();
}

Twitch.on(ev => {
  if (ev.type === 'chat') return MODE !== 'alertes' && addMessage(ev);
  if (ev.type === 'clear') {
    for (const el of $('chat').querySelectorAll('.msg')) if (!ev.login || el.dataset.login === ev.login) removeMsg(el);
    return;
  }
  if (ev.type === 'delete') { const el = $('chat').querySelector(`.msg[data-id="${CSS.escape(ev.id || '')}"]`); if (el) removeMsg(el); return; }
  if (MODE !== 'tchat' && wanted(ev)) { queue.push(ev); next(); }
});

// ---------- Réglages ----------
let lastTest = null;
SB.watchLook(L => {
  T = L.twitch;
  Twitch.follow(SB.params.get('chaine') || T.channel);
  // bouton « Tester » de l'onglet Habillage (pas au premier chargement)
  if (lastTest !== null && T.test.id !== lastTest) {
    const ev = Twitch.sample(T.test.type);
    if (ev && ev.type === 'chat') { if (MODE !== 'alertes') addMessage(ev); }
    else if (ev && MODE !== 'tchat') { queue.push(ev); next(); }
  }
  lastTest = T.test.id;
});
</script>
</body>
</html>
