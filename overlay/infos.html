<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay · Infos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/overlay.css">
<style>
  /* Quatre éléments indépendants, pilotés depuis admin/infos.html :
     bandeau nom (bas gauche), remplacement (bas gauche), carton central, bandeau défilant (tout en bas). */

  /* ---------- Bandeau nom ---------- */
  .lower { position: absolute; left: 110px; bottom: 150px; display: flex; align-items: stretch; --c: var(--accent); --slab: var(--c);
    transform: translate(var(--lower-dx, 0), var(--lower-dy, 0)) scale(var(--lower-s, 1)); transform-origin: bottom left; }
  .l-title { display: flex; align-items: center; gap: 18px; }
  .l-title .rise { --d: .45s; }
  .l-hatch { width: 34px; align-self: stretch; margin: -8px -32px -6px 0; color: var(--c); opacity: 0; transition: opacity .2s; }
  .lower.on .l-hatch { opacity: 1; transition: opacity .4s .8s; }
  .l-strip { width: 16px; background: var(--c); border-radius: var(--r) 0 0 var(--r); transform: scaleY(0); transform-origin: bottom; transition: transform .25s ease .35s; }
  .l-body { display: flex; flex-direction: column; align-items: stretch; }
  .l-title {
    padding: 8px 32px 6px 22px;
    font-size: 50px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; white-space: nowrap; line-height: 1.05;
    background: var(--paper); color: var(--ink); border-radius: 0 var(--r) 0 0;
    clip-path: inset(0 100% 0 0); transition: clip-path .3s cubic-bezier(.7,0,.3,1) .1s;
  }
  .l-subwrap { overflow: hidden; border-radius: 0 0 var(--r) 0; }
  .l-sub {
    padding: 8px 22px;
    font-size: 17px; font-weight: 700; font-stretch: 125%; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
    background: var(--ink); color: var(--paper);
    transform: translateY(-101%); transition: transform .25s ease;
  }
  .l-sub:empty { display: none; }
  .lower:has(.l-sub:empty) .l-title {   /* sans sous-titre : coin bas arrondi */ border-radius: 0 var(--r) var(--r) 0; }
  .lower.on .l-strip { transform: none; transition-delay: 0s; }
  .lower.on .l-title { clip-path: inset(0 0 0 0); transition: clip-path .55s cubic-bezier(.77,0,.18,1) .15s; }
  .lower.on .l-sub { transform: none; transition: transform .45s cubic-bezier(.2,.9,.2,1) .6s; }

  /* ---------- Remplacement ---------- */
  .subst { position: absolute; left: 110px; bottom: 150px; width: 560px; --c: var(--accent); --t: var(--on-accent); --slab: var(--c);
    transform: translate(var(--sub-dx, 0), var(--sub-dy, 0)) scale(var(--sub-s, 1)); transform-origin: bottom left; }
  .subst.on .s-row.in i { animation: bobUp 1.4s ease-in-out 1s infinite; }
  .subst.on .s-row.out i { animation: bobDown 1.4s ease-in-out 1s infinite; }
  @keyframes bobUp { 50% { transform: translateY(-4px); } }
  @keyframes bobDown { 50% { transform: translateY(4px); } }
  .s-head {
    display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 8px;
    background: var(--c); color: var(--t); border-radius: var(--r) var(--r) 0 0;
    clip-path: inset(0 100% 0 0); transition: clip-path .3s cubic-bezier(.7,0,.3,1) .2s;
  }
  .s-tag {
    display: flex; align-items: center; height: 36px; padding: 0 14px;
    background: var(--paper); color: var(--ink); border-radius: 8px;
    font-size: 14px; font-weight: 700; font-stretch: 125%; letter-spacing: .1em; text-transform: uppercase;
  }
  .s-team { font-size: 28px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; }
  .s-row {
    display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 20px 0 14px;
    background: var(--paper); color: var(--ink);
    font-size: 36px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; white-space: nowrap;
    transform: translateX(-30px); opacity: 0; transition: transform .25s, opacity .2s;
  }
  .s-row.in { border-bottom: 2px solid var(--mist); }
  .s-row.out { color: #4a4e59; border-radius: 0 0 var(--r) var(--r); }
  .s-row i {
    flex: none; display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%; font-style: normal; font-size: 14px; color: #fff;
  }
  .s-row.in i { background: var(--go); }
  .s-row.out i { background: var(--hot); }
  .s-num { min-width: 54px; padding: 0 6px; text-align: center; font-stretch: 100%; background: var(--c); color: var(--t); border-radius: 7px; }
  .s-num:empty { display: none; }
  .subst.on .s-head { clip-path: inset(0 0 0 0); transition: clip-path .5s cubic-bezier(.77,0,.18,1) 0s; }
  .subst.on .s-row { transform: none; opacity: 1; transition: transform .5s cubic-bezier(.2,.9,.2,1) .4s, opacity .4s .4s; }
  .subst.on .s-row.out { transition-delay: .55s; }

  /* ---------- Carton central ---------- */
  .veil { position: absolute; inset: 0; background: rgba(11,11,15,.45); opacity: 0; transition: opacity .5s; }
  .veil.on { opacity: 1; }
  .card {
    position: absolute; left: 50%; top: 50%;
    transform: translate(calc(-50% + var(--card-dx, 0px)), calc(-50% + var(--card-dy, 0px))) scale(var(--card-s, 1));
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 1240px;
  }
  .c-title {
    padding: 12px 30px;
    font-size: 22px; font-weight: 700; font-stretch: 125%; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
    background: var(--accent); color: var(--on-accent); border-radius: 10px;
    transform: translateY(30px); opacity: 0; transition: transform .25s, opacity .2s;
  }
  .c-title:empty { display: none; }
  .c-title.kin { --d: .7s; }
  .c-count.final { color: var(--hot); animation: tickPulse 1s ease-out infinite; }
  @keyframes tickPulse { 0% { transform: scale(1.08); } 40% { transform: none; } }
  .c-body {
    position: relative; --slab: var(--paper);
    width: 100%; overflow: hidden;
    background: var(--paper); color: var(--ink); border-radius: 20px;
    clip-path: inset(0 50% 0 50% round 20px); transition: clip-path .35s cubic-bezier(.7,0,.3,1) .1s;
  }
  .card.on .c-body { clip-path: inset(0 0 0 0 round 20px); transition: clip-path .65s cubic-bezier(.77,0,.18,1) .05s; }
  .card.on .c-title { transform: none; opacity: 1; transition: transform .5s cubic-bezier(.2,.9,.2,1) .55s, opacity .3s .55s; }

  .c-score { display: flex; align-items: stretch; height: 160px; }
  .c-team {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 30px; min-width: 0;
    background: var(--c); color: var(--t);
    font-size: 58px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; white-space: nowrap;
  }
  .c-team span { overflow: hidden; text-overflow: ellipsis; }
  .c-nums { display: flex; align-items: center; gap: 26px; padding: 0 48px; font-size: 116px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .c-nums i { font-style: normal; color: var(--accent); font-size: 70px; }
  /* Marqueurs sous chaque équipe (comme le carton de mi-temps des diffuseurs) */
  .c-scorers { display: grid; grid-template-columns: 1fr 1fr; gap: 0 60px; padding: 18px 40px 6px; }
  .c-scorers div { display: flex; flex-direction: column; gap: 4px; font-size: 26px; font-weight: 700; font-stretch: 87.5%; text-transform: uppercase; }
  .c-scorers div + div { text-align: right; }
  .c-scorers span b { font-weight: 600; color: var(--mute); font-stretch: 100%; margin-left: 8px; }
  .card:not(.m-score) .c-scorers { display: none; }
  .c-meta { padding: 16px 30px; text-align: center; font-size: 16px; font-weight: 700; font-stretch: 125%; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); background: var(--mist); }
  .c-meta:empty { display: none; }
  .c-text { padding: 44px 70px; text-align: center; font-size: 68px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; line-height: 1.05; }
  .c-count { padding: 30px 70px 20px; text-align: center; font-size: 160px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  .card .c-num, .card .c-team span, .c-text, .c-count { opacity: 0; transition: opacity .2s; }
  .card.on .c-num, .card.on .c-team span, .card.on .c-text, .card.on .c-count { opacity: 1; transition: opacity .5s .6s; }
  .card:not(.m-score) .c-score, .card:not(.m-message) .c-text, .card:not(.m-countdown) .c-count { display: none; }

  /* ---------- Bandeau défilant ---------- */
  .ticker {
    position: absolute; left: 0; right: 0; bottom: 0; height: 50px;
    display: flex; align-items: stretch;
    background: var(--ink); color: var(--paper);
    transform: translateY(100%); transition: transform .4s cubic-bezier(.7,0,.3,1);
  }
  .ticker.on { transform: translateY(var(--ticker-dy, 0)); transition: transform .55s cubic-bezier(.2,.9,.2,1); }
  /* défilant en haut de l'écran (option de l'habillage) */
  .ticker-top .ticker { top: 0; bottom: auto; transform: translateY(-100%); }
  .ticker-top .ticker.on { transform: translateY(var(--ticker-dy, 0)); }
  .t-label {
    position: relative; z-index: 2; display: flex; align-items: center; padding: 0 30px 0 64px;
    background: var(--accent); color: var(--on-accent);
    font-size: 16px; font-weight: 700; font-stretch: 125%; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
    border-radius: 0 var(--r) var(--r) 0;
  }
  .t-label.empty { display: none; }
  .t-hatch { width: 26px; align-self: stretch; margin-left: 16px; margin-right: -14px; color: var(--on-accent); opacity: .35; }
  .t-track { flex: 1; overflow: hidden; display: flex; align-items: center; -webkit-mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent); }
  .t-move { display: flex; white-space: nowrap; animation: ticker var(--dur, 30s) linear infinite; }
  .t-move span { display: flex; align-items: center; font-size: 26px; font-weight: 700; font-stretch: 87.5%; text-transform: uppercase; }
  .t-move span::after { content: ''; width: 8px; height: 8px; margin: 0 32px; border-radius: 50%; background: var(--accent); }

  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
</head>
<body>

<div class="veil" id="veil"></div>

<div class="lower" id="lower">
  <div class="l-strip"></div>
  <div class="l-body">
    <div class="l-title"><span class="rise"><span id="lTitle"></span></span><i class="l-hatch hatch"></i></div>
    <div class="l-subwrap"><div class="l-sub" id="lSub"></div></div>
  </div>
  <div class="slabs"><i></i><i></i><i></i></div>
</div>

<div class="subst" id="sub">
  <div class="s-head"><span class="s-tag">Remplacement</span><span class="s-team" id="sTeam"></span></div>
  <div class="s-row in"><i>▲</i><b class="s-num" id="sInNum"></b><span id="sIn"></span></div>
  <div class="s-row out"><i>▼</i><b class="s-num" id="sOutNum"></b><span id="sOut"></span></div>
  <div class="slabs"><i></i><i></i><i></i></div>
</div>

<div class="card" id="card">
  <div class="c-title kin" id="cTitle"></div>
  <div class="c-body" id="cBody">
    <div class="c-score">
      <div class="c-team" id="cHome"><span id="cHomeName"></span></div>
      <div class="c-nums"><span class="c-num" id="cHomeNum"></span><i>–</i><span class="c-num" id="cAwayNum"></span></div>
      <div class="c-team" id="cAway"><span id="cAwayName"></span></div>
    </div>
    <div class="c-scorers"><div id="cHomeGoals"></div><div id="cAwayGoals"></div></div>
    <div class="c-text" id="cText"></div>
    <div class="c-count" id="cCount"></div>
    <div class="c-meta" id="cMeta"></div>
    <div class="slabs"><i></i><i></i><i></i></div>
  </div>
</div>

<div class="ticker" id="ticker">
  <div class="t-label" id="tLabelBox"><span id="tLabel"></span><i class="t-hatch hatch"></i></div>
  <div class="t-track"><div class="t-move" id="tMove"></div></div>
</div>

<script src="../assets/commun.js"></script>
<script>
const { $, setText } = SB;
SB.applyLook();

let I = null;      // infos affichées (version à l'antenne en mode studio)
let live = null;   // infos actuelles (régie)
let A = null;      // antenne : quels éléments sont affichés
let S = null;      // score (pour les couleurs des équipes et le carton de score)

const shown = key => SB.EDIT ? SB.editVisible(key) : !!(A && A[SB.VUE][key]);

// Mode édition (onglet Habillage) : contenu d'exemple pour les éléments encore vides
function sample(I) {
  I = SB.clone(I || { lower: {}, sub: {}, card: { mode: 'score', title: 'Mi-temps' }, ticker: {} });
  I.lower = Object.assign({ team: '' }, I.lower);
  if (!I.lower.title) Object.assign(I.lower, { title: 'Prénom Nom', subtitle: 'Fonction · Club' });
  I.sub = Object.assign({ team: 'home' }, I.sub);
  if (!I.sub.in && !I.sub.out) Object.assign(I.sub, { in: '10 Joueur Entrant', out: '7 Joueur Sortant' });
  I.card = Object.assign({ mode: 'score', title: 'Mi-temps', text: '', time: '' }, I.card);
  I.ticker = Object.assign({ label: 'Infos' }, I.ticker);
  if (!(I.ticker.items || []).some(Boolean)) I.ticker.items = ['Exemple de message défilant', 'Second message'];
  return I;
}

// Entrée / sortie d'un élément : plaques en cascade, puis contenu
function setOn(el, v, onIntro) {
  const was = el.dataset.on === '1';
  if (v === was) return;
  el.dataset.on = v ? '1' : '0';
  SB.replay(el.querySelector(':scope > .slabs') ? el : el.querySelector('.c-body') || el, v ? 'intro' : 'outro');
  el.classList.toggle('on', v);
  if (v && onIntro) onIntro();
}

const team = side => (S && S[side]) || null;

function setColors(el, side) {
  const t = team(side);
  el.style.setProperty('--c', t ? t.color : 'var(--accent)');
  el.style.setProperty('--t', t ? SB.textColor(t.color) : 'var(--on-accent)');
}

// « 10 Léo Martin (C) » -> ['10', 'Léo Martin']
function player(line) {
  const m = (line || '').replace(/\s*\((c|cap)\)$/i, '').match(/^(\d{1,3})\s+(.+)$/);
  return m ? [m[1], m[2]] : ['', line || ''];
}

// Bandeau défilant : contenu doublé pour boucler sans à-coup, vitesse constante
let tickerKey = '';
function buildTicker(items) {
  const key = JSON.stringify(items);
  if (key === tickerKey) return;
  tickerKey = key;
  const move = $('tMove');
  const list = (items.filter(Boolean).length ? items.filter(Boolean) : ['']);
  const spans = n => Array.from({ length: n }, () => list).flat().map(txt => {
    const s = document.createElement('span');
    s.textContent = txt;
    return s;
  });
  // une série de messages au moins aussi large que l'écran, doublée pour boucler sans trou
  move.replaceChildren(...spans(1));
  const one = move.scrollWidth || 1;
  const n = Math.min(20, Math.ceil(1920 / one));
  move.replaceChildren(...spans(2 * n));
  move.style.setProperty('--dur', Math.max(10, (one * n) / 110) + 's');
}

// Noms des équipes du carton : réduits ensemble jusqu'à ce que les deux tiennent
function fitNames() {
  const a = $('cHomeName'), b = $('cAwayName');
  let size = 58;
  a.style.fontSize = b.style.fontSize = size + 'px';
  while (size > 30 && (a.scrollWidth > a.clientWidth || b.scrollWidth > b.clientWidth)) {
    size -= 2;
    a.style.fontSize = b.style.fontSize = size + 'px';
  }
}

// Compte à rebours jusqu'à l'heure indiquée (heure du serveur)
function countdown() {
  if (!I || I.card.mode !== 'countdown' || !I.card.time) return '';
  const now = new Date(SB.now());
  const [h, m] = I.card.time.split(':').map(Number);
  const target = new Date(now);
  target.setHours(h, m, 0, 0);
  const left = Math.max(0, target - now);
  const s = Math.ceil(left / 1000);
  return s >= 3600
    ? `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
    : `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function render() {
  I = SB.sceneContent(A, 'infos', live);
  if (SB.EDIT) I = sample(I);
  if (!I || (!A && !SB.EDIT)) return;

  // Bandeau nom
  const lo = I.lower;
  setText('lTitle', lo.title);
  setText('lSub', lo.subtitle);
  setColors($('lower'), lo.team);
  setOn($('lower'), shown('lower') && !!lo.title);

  // Remplacement
  const su = I.sub;
  setColors($('sub'), su.team);
  setText('sTeam', team(su.team) ? team(su.team).name : '');
  const [inNum, inName] = player(su.in), [outNum, outName] = player(su.out);
  setText('sInNum', inNum); setText('sIn', inName);
  setText('sOutNum', outNum); setText('sOut', outName);
  setOn($('sub'), shown('sub'));

  // Carton central
  const ca = I.card;
  for (const m of ['score', 'message', 'countdown']) $('card').classList.toggle('m-' + m, ca.mode === m);
  $('veil').classList.toggle('on', shown('card'));
  SB.letters($('cTitle'), ca.title);
  setText('cText', ca.text);
  let meta = '';
  if (ca.mode === 'score' && S) {
    const sp = SB.sport(S.sport);
    setColors($('cHome'), 'home');
    setColors($('cAway'), 'away');
    setText('cHomeName', S.home.name);
    setText('cAwayName', S.away.name);
    setText('cHomeNum', sp.sets ? S.home.sets : S.home.score);
    setText('cAwayNum', sp.sets ? S.away.sets : S.away.score);
    fitNames();                         // après les chiffres : ils prennent de la place
    // Marqueurs regroupés par joueur : « K. MBAPPÉ 23', 67' »
    for (const side of ['home', 'away']) {
      const goals = {};
      for (const x of S.scorers.filter(x => x.team === side && x.player)) {
        const n = SB.shortName(x.player);
        (goals[n] = goals[n] || []).push(x.minute);
      }
      const key = JSON.stringify(goals);
      const box = $(side === 'home' ? 'cHomeGoals' : 'cAwayGoals');
      if (box.dataset.key !== key) {
        box.dataset.key = key;
        box.replaceChildren(...Object.entries(goals).map(([n, mins]) => {
          const el = document.createElement('span');
          el.textContent = n;
          const b = document.createElement('b');
          b.textContent = mins.filter(Boolean).join(', ');
          el.append(b);
          return el;
        }));
      }
    }
    $('cHomeGoals').parentElement.classList.toggle('hidden', !S.scorers.some(x => x.player));
    meta = sp.sets
      ? (S.history.length ? 'Sets : ' + S.history.map(x => x.join('-')).join('  ·  ') : sp.label)
      : [sp.label, SB.period(S) && SB.period(S).name].filter(Boolean).join('  ·  ');
  } else if (ca.mode === 'countdown') {
    meta = ca.text || (ca.time ? 'Début à ' + ca.time.replace(':', 'h') : '');
  }
  setText('cMeta', meta);
  setText('cCount', countdown());
  // À l'entrée du carton de score, les chiffres comptent depuis zéro
  setOn($('card'), shown('card'), () => {
    if (ca.mode === 'score' && S) {
      const sets = !!SB.sport(S.sport).sets;
      setTimeout(() => {
        SB.countUp($('cHomeNum'), sets ? S.home.sets : S.home.score);
        SB.countUp($('cAwayNum'), sets ? S.away.sets : S.away.score);
      }, 600);
    }
  });

  // Bandeau défilant
  const ti = I.ticker;
  setText('tLabel', ti.label);
  $('tLabelBox').classList.toggle('empty', !ti.label);
  buildTicker(ti.items);
  $('ticker').classList.toggle('on', shown('ticker') && ti.items.length > 0);
}

(async () => {
  await SB.loadSports();
  SB.watch('infos', st => { live = st; render(); });
  SB.watchScene(a => { A = a; render(); });
  SB.watchLook(() => { tickerKey = ''; render(); });   // la police change la largeur du défilant
  SB.onEdit(() => render());
  SB.watch('score', st => { S = SB.fixScore(st || SB.newScore()); render(); }, 1000);
  setInterval(() => {
    if (!I || I.card.mode !== 'countdown') return;
    const txt = countdown();
    if ($('cCount').textContent !== txt) {
      setText('cCount', txt);
      const final = /^00:(0\d|10)$/.test(txt) && txt !== '00:00';    // 10 dernières secondes
      $('cCount').classList.toggle('final', final);
      if (final) SB.replay($('cCount'), 'final');
    }
  }, 250);
  // Tailles recalculées une fois la police chargée (elle est plus large que la police de secours)
  if (document.fonts) {
    document.fonts.ready.then(render);
    document.fonts.addEventListener('loadingdone', render);
  }
})();
</script>
</body>
</html>
