<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Équipes - Affichage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --font: 'Oswald', 'Arial Narrow', 'Segoe UI', Arial, sans-serif; }
  html, body { margin: 0; background: transparent; font-family: var(--font); color: #fff; overflow: hidden; }
  .hidden { display: none !important; }

  /* Dégradé à la couleur de l'équipe (même rendu que le scoreboard) */
  .teamfill {
    background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(0,0,0,.40)), var(--c);
    color: var(--t);
    text-shadow: 0 2px 4px rgba(0,0,0,.35);
  }

  .panels {
    position: fixed; top: 60px; bottom: 60px; left: 90px; right: 90px;
    display: none; gap: 60px;
  }
  .panels.ready { display: flex; }

  .panel {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column;
    border-radius: 24px; overflow: hidden;
    background: rgba(11,18,32,.94);
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.14);
    opacity: 0;
    transition: transform .6s ease, opacity .6s ease;
  }
  #cHome { transform: translateX(-80px); }
  #cAway { transform: translateX(80px); }
  .panels.show .panel { opacity: 1; transform: none; }

  .phead { display: flex; align-items: center; gap: 24px; padding: 22px 34px; min-height: 110px; box-sizing: border-box; }
  .plogo { display: none; height: 80px; max-width: 140px; object-fit: contain; }
  .plogo.has { display: block; }
  .pname {
    flex: 1; min-width: 0;
    font-size: 52px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
    white-space: nowrap; overflow: hidden;
  }

  .pbody { flex: 1; min-height: 0; overflow: hidden; padding: 22px 34px; font-size: var(--fs, 34px); }
  .ptitle { font-size: .62em; font-weight: 500; letter-spacing: 4px; text-transform: uppercase; color: #fbbf24; margin: .6em 0 .3em; }
  .ptitle:first-child { margin-top: 0; }
  .pbody ul { list-style: none; margin: 0; padding: 0; }
  .pbody li {
    display: grid; grid-template-columns: 2.1em 1fr; align-items: center; gap: .4em;
    padding: .12em 0; line-height: 1.25;
    font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
  }
  .pbody li .n { font-weight: 700; color: #fbbf24; text-align: right; }
  .coach { margin-top: .8em; font-size: .7em; letter-spacing: 2px; text-transform: uppercase; opacity: .85; }
</style>
</head>
<body>

<div class="panels" id="panels">
  <div class="panel" id="cHome">
    <div class="phead teamfill" id="cHomeHead">
      <img class="plogo" id="cHomeLogo" alt="">
      <div class="pname" id="cHomeName"></div>
    </div>
    <div class="pbody" id="cHomeBody">
      <div class="ptitle">Titulaires</div>
      <ul id="cHomeStarters"></ul>
      <div class="ptitle" id="cHomeSubsTitle">Remplaçants</div>
      <ul id="cHomeSubs"></ul>
      <div class="coach" id="cHomeCoach"></div>
    </div>
  </div>
  <div class="panel" id="cAway">
    <div class="phead teamfill" id="cAwayHead">
      <img class="plogo" id="cAwayLogo" alt="">
      <div class="pname" id="cAwayName"></div>
    </div>
    <div class="pbody" id="cAwayBody">
      <div class="ptitle">Titulaires</div>
      <ul id="cAwayStarters"></ul>
      <div class="ptitle" id="cAwaySubsTitle">Remplaçants</div>
      <ul id="cAwaySubs"></ul>
      <div class="coach" id="cAwayCoach"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = null;
let lastJson = '';
let shown = false;

// Si une image de logo est introuvable, on la cache simplement
document.querySelectorAll('img').forEach(img => { img.onerror = () => img.classList.remove('has'); });

// Texte noir ou blanc selon la luminosité de la couleur de l'équipe
function textColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? '#111' : '#fff';
}

function setColors(id, color) {
  $(id).style.setProperty('--c', color);
  $(id).style.setProperty('--t', textColor(color));
}

function setLogo(img, src) {
  if (src) {
    if (img.getAttribute('src') !== src) img.src = src;
    img.classList.add('has');
  } else {
    img.removeAttribute('src');
    img.classList.remove('has');
  }
}

// Réduit la taille des deux noms jusqu'à ce qu'ils tiennent, en gardant la même taille pour les deux
function fitBoth(a, b, max, min) {
  let size = max;
  a.style.fontSize = b.style.fontSize = size + 'px';
  while (size > min && (a.scrollWidth > a.clientWidth || b.scrollWidth > b.clientWidth)) {
    size -= 2;
    a.style.fontSize = b.style.fontSize = size + 'px';
  }
}

// Réduit la taille du texte des listes jusqu'à ce que tout tienne dans les deux colonnes
function fitBodies() {
  const bodies = [$('cHomeBody'), $('cAwayBody')];
  let size = 36;
  bodies.forEach(b => b.style.setProperty('--fs', size + 'px'));
  while (size > 12 && bodies.some(b => b.scrollHeight > b.clientHeight + 1)) {
    size -= 1;
    bodies.forEach(b => b.style.setProperty('--fs', size + 'px'));
  }
}

// Une ligne "10 Léo Martin" devient un numéro (10) et un nom (Léo Martin)
function fillList(ul, lines) {
  ul.textContent = '';
  for (const line of lines) {
    const m = line.match(/^(\d{1,3})\s+(.+)$/);
    const li = document.createElement('li');
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = m ? m[1] : '';
    const nom = document.createElement('span');
    nom.textContent = m ? m[2] : line;
    li.append(n, nom);
    ul.append(li);
  }
}

function apply(S) {
  for (const [side, cap] of [['home', 'cHome'], ['away', 'cAway']]) {
    const t = S[side];
    setColors(cap + 'Head', t.color);
    $(cap + 'Name').textContent = t.name;
    setLogo($(cap + 'Logo'), t.logo);
    fillList($(cap + 'Starters'), t.starters);
    fillList($(cap + 'Subs'), t.subs);
    $(cap + 'SubsTitle').classList.toggle('hidden', t.subs.length === 0);
    $(cap + 'Coach').textContent = t.coach ? 'Entraîneur : ' + t.coach : '';
    $(cap + 'Coach').classList.toggle('hidden', !t.coach);
  }
  fitBoth($('cHomeName'), $('cAwayName'), 52, 24);
  fitBodies();
}

function render() {
  if (!state || !state.home || !state.away) return;
  $('panels').classList.add('ready');
  const json = JSON.stringify(state);
  if (json !== lastJson) {          // on ne reconstruit l'écran que si les données ont changé
    lastJson = json;
    apply(state);
  }
  if (!shown) {                      // animation d'entrée, une seule fois à l'ouverture de la page
    shown = true;
    requestAnimationFrame(() => requestAnimationFrame(() => $('panels').classList.add('show')));
  }
}

// Lecture des données sur le serveur (2 fois par seconde)
async function poll() {
  try {
    const r = await fetch('equipes-lire.php?_=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (j.state) state = j.state;
    render();
  } catch (e) {
    // En cas de coupure, on garde l'affichage actuel et on réessaie
  }
  setTimeout(poll, 500);
}

// Une fois la police chargée, on recalcule les tailles de texte
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { lastJson = ''; render(); });
}
poll();
</script>
</body>
</html>
