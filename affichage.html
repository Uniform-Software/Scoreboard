<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scoreboard - Affichage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --font: 'Oswald', 'Arial Narrow', 'Segoe UI', Arial, sans-serif; }
  html, body { margin: 0; background: transparent; font-family: var(--font); }

  #board {
    position: absolute; top: 36px; left: 36px;
    display: flex; align-items: stretch;
    height: 80px;
    border-radius: 16px; overflow: hidden;
    color: #fff;
    background: #0b1220;
    box-shadow: 0 10px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.14);
    visibility: hidden; /* affiché dès que le premier score est reçu du serveur */
  }
  #board.ready { visibility: visible; animation: slideIn .6s ease-out; }
  @keyframes slideIn { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Blocs équipes : fond dégradé à la couleur de l'équipe */
  .team {
    display: flex; align-items: center; gap: 14px;
    padding: 0 26px;
    background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(0,0,0,.40)), var(--c);
    color: var(--t);
    text-shadow: 0 1px 3px rgba(0,0,0,.35);
  }

  /* Astuce : chaque bloc contient les DEUX noms superposés (un caché),
     donc les deux blocs ont toujours la même largeur. */
  .name {
    display: grid; text-align: center;
    font-size: 34px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    white-space: nowrap;
  }
  .name span { grid-area: 1 / 1; }
  .name .ghost { visibility: hidden; }

  .sets {
    display: none;
    min-width: 30px; text-align: center;
    background: rgba(0,0,0,.45);
    border-radius: 8px; padding: 2px 10px;
    font-size: 26px; font-weight: 700;
    color: #fff; text-shadow: none;
  }
  .volley .sets { display: block; }

  /* Scores : seule la case est fixe, c'est le chiffre qui réagit */
  .score {
    display: flex; align-items: center; justify-content: center;
    min-width: 92px;
    background: linear-gradient(180deg, #1b263b, #0b1220);
    font-size: 56px; font-weight: 700;
    border-bottom: 6px solid var(--c);
    box-sizing: border-box;
  }
  .num { display: inline-block; }
  .num.pop { animation: pop .35s ease-out; }
  @keyframes pop {
    0%   { transform: scale(1);    color: #fff; }
    40%  { transform: scale(1.12); color: #fbbf24; }
    100% { transform: scale(1);    color: #fff; }
  }

  /* Centre : chrono + période */
  .mid {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 130px; padding: 0 20px;
    background: linear-gradient(180deg, #0f172a, #020617);
    border-left: 1px solid rgba(255,255,255,.1);
    border-right: 1px solid rgba(255,255,255,.1);
  }
  #clock { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  #period { font-size: 15px; font-weight: 500; letter-spacing: 3px; color: #fbbf24; text-transform: uppercase; min-height: 18px; }
</style>
</head>
<body>
<div id="board">
  <div class="team" id="home">
    <div class="name"><span id="homeName"></span><span class="ghost" id="homeGhost"></span></div>
    <div class="sets" id="homeSets">0</div>
  </div>
  <div class="score" id="homeScoreBox"><span class="num" id="homeScore">0</span></div>
  <div class="mid"><div id="clock">00:00</div><div id="period"></div></div>
  <div class="score" id="awayScoreBox"><span class="num" id="awayScore">0</span></div>
  <div class="team" id="away">
    <div class="sets" id="awaySets">0</div>
    <div class="name"><span id="awayName"></span><span class="ghost" id="awayGhost"></span></div>
  </div>
</div>

<script>
const PERIODS = {
  foot: ['1re MT', '2e MT', 'PROL'],
  rugby: ['1re MT', '2e MT'],
  hand: ['1re MT', '2e MT'],
  basket: ['Q1', 'Q2', 'Q3', 'Q4', 'PROL'],
  volley: []
};

let state = null;      // dernier score reçu du serveur
let offset = 0;        // écart entre l'horloge du serveur et celle de cet appareil
let firstSample = true;

const nowServer = () => Date.now() + offset;

// --- Récupération du score auprès du serveur (2 fois par seconde) ---
async function poll() {
  try {
    const t0 = Date.now();
    const r = await fetch('lire.php?_=' + t0, { cache: 'no-store' });
    const t1 = Date.now();
    const j = await r.json();
    // On estime l'écart d'horloge en tenant compte du temps de trajet (lissé pour éviter les à-coups)
    const sample = j.serverTime - (t0 + t1) / 2;
    offset = firstSample ? sample : offset * 0.8 + sample * 0.2;
    firstSample = false;
    if (j.state) state = j.state;
  } catch (e) {
    // En cas de coupure, on garde le dernier score affiché et on réessaie
  }
  setTimeout(poll, 500);
}

function clockMs(c) {
  let ms = c.baseMs;
  if (c.running) {
    const d = nowServer() - c.startedAt;
    ms += (c.dir === 'up') ? d : -d;
  }
  return Math.max(0, ms);
}

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function setText(id, text) {
  const el = document.getElementById(id);
  if (el.textContent !== String(text)) el.textContent = text;
}

function setScore(id, value) {
  const el = document.getElementById(id);
  if (el.textContent !== String(value)) {
    el.textContent = value;
    el.classList.remove('pop');
    void el.offsetWidth; // relance l'animation
    el.classList.add('pop');
  }
}

// Texte noir ou blanc selon la luminosité de la couleur de l'équipe
function textColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? '#111' : '#fff';
}

function render() {
  const S = state;
  if (!S) return;
  document.getElementById('board').classList.add('ready');
  const isVolley = S.sport === 'volley';
  document.getElementById('board').classList.toggle('volley', isVolley);

  for (const side of ['home', 'away']) {
    const color = S[side].color;
    for (const id of [side, side + 'ScoreBox']) {
      document.getElementById(id).style.setProperty('--c', color);
    }
    document.getElementById(side).style.setProperty('--t', textColor(color));
  }

  setText('homeName', S.home.name);
  setText('awayName', S.away.name);
  setText('homeGhost', S.away.name); // nom caché de l'autre équipe : sert à égaliser les largeurs
  setText('awayGhost', S.home.name);
  setScore('homeScore', S.home.score);
  setScore('awayScore', S.away.score);
  setText('homeSets', S.home.sets);
  setText('awaySets', S.away.sets);

  if (isVolley) {
    setText('clock', 'SET ' + (S.home.sets + S.away.sets + 1));
    setText('period', '');
  } else {
    setText('clock', fmt(clockMs(S.clock)));
    setText('period', (PERIODS[S.sport] || [])[S.period] || '');
  }
}

setInterval(render, 100);
poll();
</script>
</body>
</html>
